<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Tyler.Center: apps, websites, and things I want to share.">
  <meta property="og:title" content="Tyler.Center">
  <meta property="og:description" content="Apps, websites, articles, videos, writing, and photography from Tyler Mulvey.">
  <meta property="og:url" content="https://tyler.center/">
  <link rel="canonical" href="https://tyler.center/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Tyler.Center</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v2.css">
  <link rel="stylesheet" href="texture.css?v=20260930-mobile-menu">

</head>
<body>
  <div class="desktop-grain" aria-hidden="true"></div>
  <div class="desktop-menu" aria-label="Desktop menu bar">
    <div class="desktop-menu-left"><span class="desktop-mark" aria-hidden="true">✳</span><strong>Tyler.Center</strong><button class="desktop-menu-button" data-menu="file">File</button><button class="desktop-menu-button" data-menu="rec">Rec</button><button class="desktop-menu-button" data-menu="view">View</button><button class="desktop-menu-button" data-menu="window">Window</button></div>
    <div class="desktop-menu-right"><span class="desktop-wifi" aria-hidden="true">◕</span><span id="desktopClock"></span></div>
  </div>
  <div class="desktop-icons">
    <button class="desktop-icon" data-desktop-open="home" aria-label="Open Tyler.Center"><span class="desktop-icon-art shelf-art">✦</span><span>Tyler.Center</span></button>
    <button class="desktop-icon" data-open-email aria-label="Open Email"><span class="desktop-icon-art email-icon-art" aria-hidden="true">✉<span data-email-unread hidden></span></span><span>Email</span></button>
    <a class="desktop-icon linkedin-link" href="https://www.linkedin.com/in/tylermulvey/" aria-label="LinkedIn profile (opens in a new tab)" target="_blank" rel="noopener"><span class="desktop-icon-art linkedin-art" aria-hidden="true">in<span class="icon-arrow">↗</span></span><span>LinkedIn ↗</span></a>
  </div>
  <button class="wallpaper-credit" data-action="wallpaper-credit">Wallpaper: NASA / Unsplash ↗</button>
  <div class="app-shell" id="appWindow">
    <div class="topbar">
      <div class="traffic"><button class="close-light" id="windowClose" aria-label="Close window" title="Close"></button><button class="minimize-light" id="windowMinimize" aria-label="Minimize window" title="Minimize"><span class="mobile-minimize-label">− Minimize</span></button><button class="zoom-light" id="windowZoom" aria-label="Zoom window" title="Zoom"></button></div>
      <div class="topbar-center">
        <span class="history-dots" aria-hidden="true">‹ &nbsp; ›</span>
        <button class="search-trigger" id="searchTrigger" type="button"><span class="search-icon">⌕</span><span>Search Tyler.Center</span><kbd>⌘ K</kbd></button>
      </div>
      <div class="topbar-right"><span class="presence-dot"></span><span>tyler.center</span></div>
    </div>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Channels">
        <div class="workspace-title"><div><strong>Tyler.Center</strong><span>An ongoing collection</span></div><span class="workspace-chevron">⌄</span></div>
        <div class="sidebar-scroll">
          <button class="home-link" data-channel="home"><span class="home-icon">✦</span> About me <span class="home-arrow">↗</span></button>
          <div id="channelNav"></div>
          <div id="readerNav"></div>
          <div class="side-label side-label-small">A NOTE FROM TYLER</div>
          <div class="sidebar-note">a collection of stuff i'm staring at when i'm looking at a screen</div>
          <div class="mobile-actions"><button type="button" data-open-email>✉ &nbsp; Email inbox <span data-email-unread hidden></span></button><button data-menu-action="spider">✳ &nbsp; Take a break</button><a class="linkedin-link" href="https://www.linkedin.com/in/tylermulvey/" target="_blank" rel="noopener">in &nbsp; LinkedIn ↗</a><button data-action="wallpaper-credit">↗ &nbsp; Wallpaper credit</button><button data-menu-action="recommend">✦ &nbsp; Recommend something</button><button data-menu-action="drafts">▤ &nbsp; Saved drafts</button><button data-menu-action="surprise">▶ &nbsp; Surprise me</button><button data-menu-action="email">✉ &nbsp; Email me</button><button data-menu-action="instagram">◎ &nbsp; Instagram ↗</button><button data-menu-action="twitter">𝕏 &nbsp; Twitter / X ↗</button></div>
        </div>
        <div class="sidebar-footer"><span class="profile-avatar tyler-avatar"><img src="assets/tyler-avatar.png" alt="" width="40" height="40"></span><div><strong>Tyler Mulvey</strong><span>Currently collecting</span></div><span class="footer-presence"></span></div>
      </aside>
      <div class="mobile-scrim" id="mobileScrim" hidden></div>
      <main class="main">
        <header class="channel-header"><button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open channels" aria-controls="sidebar" aria-expanded="false"><span class="mobile-menu-lines" aria-hidden="true"><span></span><span></span><span></span></span><span class="mobile-menu-caption" aria-hidden="true">MENU</span></button><span class="header-hash">#</span><div class="channel-heading"><strong id="headerTitle">about-tyler</strong><p class="header-description" id="headerDescription">A little introduction</p></div><div class="header-actions"><button id="headerSearch" aria-label="Search" title="Search">⌕</button><button id="headerAdd" aria-label="Add to this channel" title="Add to this channel">＋</button></div></header>
        <div class="channel-toolbar" id="channelToolbar" hidden>
        <div class="channel-filters" id="channelFilters" aria-label="Filter this channel" hidden></div>
        <div class="channel-reading-bar" id="channelReadingBar" hidden><span>oldest → newest</span><div><button id="lastReadButton">↑ Last read</button><button id="latestButton">Latest ↓</button></div></div>
        </div>
        <div class="content-scroll" id="contentScroll"><div class="content-inner" id="content"></div></div>
      </main>
    </div>
    <button class="window-resize-handle" id="windowResize" aria-label="Resize window" title="Drag to resize. Arrow keys also work."></button>
  </div>
  <section class="email-window" id="emailWindow" aria-label="Email" hidden></section>
  <div id="desktopMenuHost"></div>
  <div id="rocketMenuHost"></div>
  <div class="modal-root" id="readerModal"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="search-root" id="searchRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="unread.js"></script>
  <script src="spider-engine.js"></script>
  <script src="spider.js"></script>
  <script src="owner-badges.js"></script>
  <script src="about.js?v=20260930-channel-groups"></script>
  <script src="feeds.js"></script>
  <script src="link-previews.js"></script>
  <script src="preview-cards.js"></script>
  <script src="channel-filters.js?v=20261001-compact-filters"></script>
  <script src="vendor/supabase.js"></script>
  <script src="reader-config.js"></script>
  <script src="reader-account.js"></script>
  <script src="desktop-selection.js"></script>
  <script src="email-app.js?v=20261001-minimize-bar"></script>
  <script src="app.js?v=20261001-minimize-bar"></script>
  <script src="reader-ui.js"></script>
  <script src="reader-comments.js"></script>
</body>
</html>

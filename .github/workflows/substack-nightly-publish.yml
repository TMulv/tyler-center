# Tyler.Center nightly Substack publish, v2
#
# Commit this file to the repo at: .github/workflows/substack-nightly-publish.yml
# (replace the v1 file that used the raw API login).
# Also commit: .github/scripts/substack_publish.py
#
# The GitHub App cannot write .github/workflows via the API; commit both files
# through the browser signed in as TMulv (the Oct 22 v1 file landed that way).
#
# Why v2: the v1 raw-API login (python-substack with SUBSTACK_EMAIL/PASSWORD)
# got a 403 from Substack's Cloudflare bot-check on GitHub runner IPs
# (run 39879697630, 2026-10-22 ~9pm ET). A real Chromium browser passes the
# check; the script logs in through the browser UI, exports the session
# cookies, and publishes through python-substack with cookies_string.
#
# How it works:
# - The 8:30pm ET tc-substack-8pm-publish cron commits
#   substack-queue/latest.md (+ title.txt, subtitle.txt). That push triggers
#   this workflow in live mode: browser login -> cookie export -> publish +
#   send to Everyone.
# - Manual runs (Actions > Substack nightly publish > Run workflow) default to
#   mode=draft: creates a DRAFT only, prints its edit URL, never publishes or
#   sends. Use this to test the login path before any live night.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   SUBSTACK_EMAIL     - login email for tylercenter.substack.com
#   SUBSTACK_PASSWORD  - login password
# (Tyler confirmed both set 2026-10-22; unverified from the agent side.)

name: Substack nightly publish

on:
  push:
    paths:
      - 'substack-queue/latest.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'draft = create a draft only (safe test). live = publish and send to Everyone.'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - live

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher and browser
        run: |
          pip install 'python-substack==0.10.0' playwright
          python -m playwright install chromium --with-deps

      - name: Browser login, cookie export, publish
        env:
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          MODE: ${{ inputs.mode || 'live' }}
        run: xvfb-run -a python .github/scripts/substack_publish.py

name: Sync channel feeds
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-feeds.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: channel-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      # Each job commits snapshots; serialize to avoid competing pushes.
      max-parallel: 1
      matrix:
        include:
          - feed: notion
            label: Notion channels
          - feed: writing
            label: Betting Antelope writing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Check sync behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch Betting Antelope
        if: matrix.feed == 'writing'
        id: rss
        continue-on-error: true
        run: python3 scripts/sync_feeds.py rss
      - name: Fetch finished newsletter editions
        if: matrix.feed == 'notion'
        id: notion
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN_NEWSLETTER || secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_feeds.py notion
      - name: Fetch approved Read Later metadata
        if: matrix.feed == 'notion'
        id: read_later
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN_NEWSLETTER || secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_feeds.py read-later
      - name: Fetch public built projects from My Domains
        if: matrix.feed == 'notion'
        id: domains
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN_NEWSLETTER || secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_feeds.py domains
      - name: Fetch Watch or Listen Later
        if: matrix.feed == 'notion'
        id: watch_later
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN_NEWSLETTER || secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_feeds.py watch-later
      - name: Publish changed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/writing.json data/newsletters.json data/articles.json data/websites.json data/watch.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update channel feeds'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN commits do not trigger legacy Pages builds by themselves.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit + " " + .status')
          head=$(git rev-parse HEAD)
          if [ "$latest" != "$head built" ] && [ "$latest" != "$head building" ] && [ "$latest" != "$head queued" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
      - name: Summarize channel results
        if: always()
        env:
          RSS_RESULT: ${{ steps.rss.outcome }}
          NEWSLETTER_RESULT: ${{ steps.notion.outcome }}
          READ_LATER_RESULT: ${{ steps.read_later.outcome }}
          DOMAINS_RESULT: ${{ steps.domains.outcome }}
          WATCH_RESULT: ${{ steps.watch_later.outcome }}
        run: python3 scripts/feed_summary.py
      - name: Report source failures
        if: steps.rss.outcome == 'failure' || steps.notion.outcome == 'failure' || steps.read_later.outcome == 'failure' || steps.domains.outcome == 'failure' || steps.watch_later.outcome == 'failure'
        run: |
          echo 'A source failed. Its last successful snapshot remains available; see the source step above.'
          exit 1

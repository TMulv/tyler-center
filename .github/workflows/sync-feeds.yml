name: Sync channel feeds
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sync-feeds.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: channel-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check sync behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch Betting Antelope
        id: rss
        continue-on-error: true
        run: python3 scripts/sync_feeds.py rss
      - name: Fetch finished newsletter editions
        id: notion
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_feeds.py notion
      - name: Publish changed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/writing.json data/newsletters.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update channel feeds'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN commits do not trigger legacy Pages builds by themselves.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit + " " + .status')
          head=$(git rev-parse HEAD)
          if [ "$latest" != "$head built" ] && [ "$latest" != "$head building" ] && [ "$latest" != "$head queued" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
      - name: Report source failures
        if: steps.rss.outcome == 'failure' || steps.notion.outcome == 'failure'
        run: |
          echo 'A source failed. Its last successful snapshot remains available; see the source step above.'
          exit 1
